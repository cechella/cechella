<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .slide {
    width:1080px;
    height:1350px;
    position:relative;
    overflow:hidden;
    background:#111;
    font-family:'Instrument Sans', sans-serif;
  }
  .bg {
    position:absolute; inset:0;
    background-size:cover;
    background-position:50% 38%;
    background-image: url('{{IMAGE_URL}}');
  }
  .overlay {
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.85) 100%);
  }
  .overlay-left {
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.2) 45%, transparent 70%);
  }
  .top-bar {
    position:absolute; top:32px; left:32px; right:32px;
    display:flex; justify-content:space-between; align-items:center; z-index:10;
  }
  .pill-black {
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    padding: 8px 16px;
    display:flex; align-items:center; gap:6px;
    font-size:20px; font-weight:500; color:#fff;
  }
  .pill-black .dot { width:8px; height:8px; background:#4ade80; border-radius:50%; }
  .page-count { font-size:20px; font-weight:500; color:#fff; letter-spacing:1px; }
  .content {
    position:absolute;
    top:140px; left:48px; right:48px;
    bottom:160px;
    z-index:10;
    display:flex; flex-direction:column;
  }
  .badge {
    display:inline-block;
    background: rgba(255,255,255,0.92);
    color:#1a1a1a;
    font-size:16px; font-weight:600; letter-spacing:0.8px;
    padding:8px 16px; border-radius:999px;
    margin-bottom:20px;
    align-self:flex-start;
  }
  .badge.hidden { display:none; }
  .title {
    font-family:'Fraunces', serif;
    font-size:52px; line-height:0.95; font-weight:700;
    color:#fff; letter-spacing:-0.02em;
    margin-bottom:18px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    white-space: pre-line;
  }
  .desc {
    font-size:20px; line-height:1.4; font-weight:400;
    color: rgba(255,255,255,0.92);
    max-width:520px;
    text-shadow: 0 1px 10px rgba(0,0,0,0.6);
    white-space: pre-line;
  }
  .signature {
    position:absolute;
    left:48px;
    bottom:110px;
    z-index:10;
  }
  .signature .line {
    width:180px; height:2px; background: rgba(255,255,255,0.8);
    margin-bottom:12px;
  }
  .signature .name {
    font-size:18px; font-weight:600; letter-spacing:1.2px; color:#fff;
  }
  .footer {
    position:absolute;
    left:48px; right:48px; bottom:36px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:10;
  }
  .footer-left {
    font-size:14px; font-weight:600; letter-spacing:1.5px; color: rgba(255,255,255,0.7);
  }
  .footer-right {
    width:36px; height:36px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; color:#fff;
  }
</style>
</head>
<body>
  <div class="slide" id="slide">
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="overlay-left"></div>

    <div class="top-bar">
      <div class="pill-black"><span class="dot"></span> @viniciuscechella</div>
      <div class="page-count">{{SLIDE_NUM}} / {{TOTAL}}</div>
    </div>

    <div class="content">
      <div class="badge" id="badge">{{BADGE}}</div>
      <h1 class="title">{{TITLE}}</h1>
      <p class="desc">{{DESC}}</p>
    </div>

    <div class="signature">
      <div class="line"></div>
      <div class="name">DR. VINÍCIUS CECHELLA</div>
    </div>

    <div class="footer">
      <div class="footer-left">HORMONE ECOSYSTEM</div>
      <div class="footer-right">{{SLIDE_NUM}}</div>
    </div>
  </div>
<script>
  const badge = document.getElementById('badge');
  if (!badge.textContent.trim()) badge.classList.add('hidden');
</script>
</body>
</html>
