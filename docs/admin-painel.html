<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hormone Ecosystem — Painel Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; }

  header {
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  header h1 span { color: #22c55e; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .live-badge { font-size: 12px; color: #22c55e; display: flex; align-items: center; }

  .layout { display: flex; height: calc(100vh - 57px); }

  /* SIDEBAR — lista de leads */
  .sidebar {
    width: 320px;
    min-width: 320px;
    border-right: 1px solid #2a2a2a;
    overflow-y: auto;
    background: #141414;
  }
  .sidebar-header {
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lead-count { background: #22c55e22; color: #22c55e; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  .lead-item {
    padding: 14px 16px;
    border-bottom: 1px solid #1e1e1e;
    cursor: pointer;
    transition: background 0.15s;
  }
  .lead-item:hover { background: #1e1e1e; }
  .lead-item.active { background: #1e2d1e; border-left: 3px solid #22c55e; }

  .lead-name { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .lead-phone { font-size: 12px; color: #666; margin-bottom: 8px; }
  .lead-last-msg { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }

  /* Progress bar 7 etapas */
  .etapa-bar { display: flex; gap: 3px; }
  .etapa-dot {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #2a2a2a;
    transition: background 0.3s;
  }
  .etapa-dot.done { background: #22c55e; }
  .etapa-dot.active { background: #86efac; }

  .etapa-label {
    font-size: 11px;
    color: #22c55e;
    margin-top: 4px;
    font-weight: 500;
  }
  .temp-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    margin-left: 6px;
  }
  .temp-quente { background: #ef444422; color: #f87171; }
  .temp-morno  { background: #f59e0b22; color: #fbbf24; }
  .temp-frio   { background: #3b82f622; color: #60a5fa; }

  .lead-time { font-size: 10px; color: #444; margin-top: 4px; }

  /* MAIN — chat */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid #2a2a2a;
    background: #141414;
  }
  .chat-header-name { font-size: 16px; font-weight: 600; color: #fff; }
  .chat-header-sub { font-size: 13px; color: #666; margin-top: 2px; }

  /* Etapas timeline no topo */
  .etapas-timeline {
    display: flex;
    padding: 16px 24px;
    gap: 0;
    border-bottom: 1px solid #1e1e1e;
    background: #111;
    overflow-x: auto;
  }
  .etapa-step {
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 100px;
  }
  .etapa-step:last-child .etapa-line { display: none; }
  .etapa-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2a2a2a;
    border: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #555;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .etapa-circle.done { background: #166534; border-color: #22c55e; color: #22c55e; }
  .etapa-circle.active { background: #14532d; border-color: #86efac; color: #fff; box-shadow: 0 0 8px #22c55e44; }
  .etapa-line { flex: 1; height: 2px; background: #2a2a2a; margin: 0 4px; }
  .etapa-line.done { background: #22c55e; }
  .etapa-info { position: absolute; margin-top: 36px; font-size: 9px; color: #555; white-space: nowrap; }
  .etapa-step-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 80px; }
  .etapa-step-label { font-size: 9px; color: #555; margin-top: 4px; text-align: center; max-width: 70px; line-height: 1.2; }
  .etapa-step-label.active { color: #86efac; }
  .etapa-step-label.done { color: #4ade80; }

  /* Chat messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg { display: flex; gap: 10px; max-width: 75%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg.user .msg-bubble { background: #166534; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .msg-bubble { background: #1e1e1e; color: #e0e0e0; border-bottom-left-radius: 4px; border: 1px solid #2a2a2a; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg.user .msg-avatar { background: #166534; color: #fff; }
  .msg.assistant .msg-avatar { background: #1e3a5f; color: #60a5fa; }

  .msg-time { font-size: 10px; color: #444; margin-top: 4px; text-align: right; }
  .msg.assistant .msg-time { text-align: left; }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    gap: 12px;
  }
  .empty-state svg { width: 48px; height: 48px; }
  .empty-state p { font-size: 14px; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: #444; font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .no-leads { padding: 24px 16px; color: #444; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Hormone Ecosystem <span>— Admin</span></h1>
  <div class="live-badge"><span class="status-dot"></span> Tempo real</div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      Leads ativos
      <span class="lead-count" id="lead-count">0</span>
    </div>
    <div id="leads-list"><div class="loading">Carregando...</div></div>
  </div>

  <div class="main" id="main-panel">
    <div class="empty-state">
      <svg fill="none" stroke="#333" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
      </svg>
      <p>Selecione um lead para ver o chat</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rmsblsoqqhtntyomhsh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtc2Jsc29xcWh0YW50eW9taHNoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDg5MjkwOCwiZXhwIjoyMDk2NDY4OTA4fQ.yAzRuavFQgk8cVkXnANNc7bl_v-JqLmSMjh5A9Wfytw';

const ETAPAS = [
  { n: 1, label: 'Apresentação' },
  { n: 2, label: 'Conexão' },
  { n: 3, label: 'D.I.' },
  { n: 4, label: 'Speech' },
  { n: 5, label: 'Fechamento' },
  { n: 6, label: 'Referidos' },
  { n: 7, label: 'Validação' },
];

const ETAPA_NAMES = {
  1: 'ETAPA 1: Apresentação',
  2: 'ETAPA 2: Conexão',
  3: 'ETAPA 3: D.I. — Combinado',
  4: 'ETAPA 4: Speech do Produto',
  5: 'ETAPA 5: Fechamento',
  6: 'ETAPA 6: Referidos',
  7: 'ETAPA 7: Validação',
};

let selectedLead = null;
let allLeads = [];

async function fetchLeads() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?select=*&order=updated_at.desc`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
    }
  });
  if (!res.ok) return [];
  return res.json();
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = (Date.now() - new Date(ts)) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `${Math.floor(diff/60)}min atrás`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
  return new Date(ts).toLocaleDateString('pt-BR');
}

function getLastMsg(historico) {
  if (!historico || !historico.length) return 'Sem mensagens';
  const last = historico[historico.length - 1];
  return last.content?.substring(0, 60) + (last.content?.length > 60 ? '...' : '');
}

function renderLeadsList(leads) {
  const container = document.getElementById('leads-list');
  document.getElementById('lead-count').textContent = leads.length;

  if (!leads.length) {
    container.innerHTML = '<div class="no-leads">Nenhum lead ainda.<br>Aguardando primeiras mensagens.</div>';
    return;
  }

  container.innerHTML = leads.map(lead => {
    const etapa = lead.etapa || 1;
    const nome = lead.nome || lead.telefone || 'Desconhecido';
    const temp = lead.temperatura || 'morno';
    const historico = lead.historico || [];
    const active = selectedLead && selectedLead.id === lead.id;

    const dots = ETAPAS.map((e, i) => {
      let cls = '';
      if (i + 1 < etapa) cls = 'done';
      else if (i + 1 === etapa) cls = 'active';
      return `<div class="etapa-dot ${cls}"></div>`;
    }).join('');

    return `
      <div class="lead-item ${active ? 'active' : ''}" onclick="selectLead('${lead.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="lead-name">${nome}<span class="temp-badge temp-${temp}">${temp}</span></div>
        </div>
        <div class="lead-phone">${lead.telefone || ''}</div>
        <div class="lead-last-msg">${getLastMsg(historico)}</div>
        <div class="etapa-bar">${dots}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <div class="etapa-label">${ETAPA_NAMES[etapa] || ''}</div>
          <div class="lead-time">${timeAgo(lead.updated_at)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderChat(lead) {
  const etapa = lead.etapa || 1;
  const nome = lead.nome || lead.telefone || 'Desconhecido';
  const historico = lead.historico || [];

  const timeline = ETAPAS.map((e, i) => {
    let circleClass = '';
    let labelClass = '';
    let lineClass = '';
    if (i + 1 < etapa) { circleClass = 'done'; labelClass = 'done'; lineClass = 'done'; }
    else if (i + 1 === etapa) { circleClass = 'active'; labelClass = 'active'; }

    return `
      <div class="etapa-step-wrapper">
        <div style="display:flex;align-items:center;width:100%">
          <div class="etapa-circle ${circleClass}">${e.n}</div>
          ${i < 6 ? `<div class="etapa-line ${lineClass}"></div>` : ''}
        </div>
        <div class="etapa-step-label ${labelClass}">${e.label}</div>
      </div>
    `;
  }).join('');

  const messages = historico.map(msg => {
    const isUser = msg.role === 'user';
    const avatar = isUser
      ? nome.charAt(0).toUpperCase()
      : 'Dr';
    const time = msg.ts ? new Date(msg.ts).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) : '';
    return `
      <div class="msg ${isUser ? 'user' : 'assistant'}">
        <div class="msg-avatar">${avatar}</div>
        <div>
          <div class="msg-bubble">${msg.content || ''}</div>
          <div class="msg-time">${time}</div>
        </div>
      </div>
    `;
  }).join('');

  const dor = lead.dor_principal ? `· Dor: ${lead.dor_principal}` : '';

  document.getElementById('main-panel').innerHTML = `
    <div class="chat-header">
      <div class="chat-header-name">${nome}</div>
      <div class="chat-header-sub">${lead.telefone || ''} ${dor}</div>
    </div>
    <div class="etapas-timeline">${timeline}</div>
    <div class="chat-messages" id="chat-scroll">
      ${messages.length ? messages : '<div style="color:#444;text-align:center;margin-top:40px;font-size:14px">Sem mensagens ainda</div>'}
    </div>
  `;

  const scroll = document.getElementById('chat-scroll');
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}

function selectLead(id) {
  selectedLead = allLeads.find(l => l.id === id);
  if (selectedLead) renderChat(selectedLead);
  renderLeadsList(allLeads);
}

async function refresh() {
  try {
    const leads = await fetchLeads();
    allLeads = leads;
    renderLeadsList(leads);

    if (selectedLead) {
      const updated = leads.find(l => l.id === selectedLead.id);
      if (updated) {
        const oldEtapa = selectedLead.etapa;
        selectedLead = updated;
        renderChat(updated);
        renderLeadsList(leads);
      }
    }
  } catch(e) {
    console.error('Erro ao buscar leads:', e);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
